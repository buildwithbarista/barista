# Nightly SCA — fresh-DB dependency scan.
#
# Re-runs the SCA suite (cargo-deny, OSV-Scanner, Trivy) every night
# against `main` with a *fresh*
# advisory database for each scanner. The PR-time `sca.yml` workflow
# may legitimately hit cached DB state (the maven cache restored by
# `actions/cache`, the OSV-Scanner
# action's in-image dataset); this workflow
# burns those caches by design so a newly-published CVE that lands
# between PRs surfaces within ~24 hours.
#
# Coverage matches `sca.yml` exactly. The split is *cadence*, not
# *content*: PR + push runs in `sca.yml` exist to gate merges; this
# workflow exists to catch findings published after the last merge.
#
# Issue-filing path: this workflow's SARIF uploads (and the
# code-scanning alerts they create) are picked up by
# `security-finding-to-issue.yml` via its `workflow_run` trigger —
# the dedup logic in `.github/scripts/security_finding_to_issue.py`
# guarantees a net-new advisory results in exactly one new issue.
# Findings already filed under `sca.yml` (same scanner, same fingerprint)
# are deduped by the existing-issues check; this workflow only opens
# new issues for *net-new* findings, which is the value-add over
# the daily `sca.yml` run.
#
# Trigger:
#   - schedule: 04:37 UTC nightly. Offset from `sca.yml`'s 04:17 (when
#                that schedule was active; now removed in favor of this
#                workflow) and `secret-scan.yml`'s 04:19 so the three
#                security workflows don't contend for shared runners.
#                Off-the-hour to dodge the GitHub cron storm.
#   - workflow_dispatch: manual re-run on demand (e.g., after a known
#                CVE drops and we want the issue filed before the next
#                nightly tick).
#
# Every action is pinned to a commit SHA (not a floating tag). The
# human-readable tag is recorded next to the SHA so future readers can
# audit drift. When bumping, update both the SHA and the comment.

name: SCA nightly — fresh-DB dependency scan

on:
  schedule:
    # 04:37 UTC nightly. Five+ minutes after sca.yml's old slot
    # (04:17) and secret-scan.yml's slot (04:19); off-the-hour to
    # dodge the top-of-hour cron storm on GitHub's shared schedulers.
    - cron: "37 4 * * *"
  workflow_dispatch:

# Default-deny at the workflow level; each job opts in explicitly.
permissions: {}

# Serialize nightly runs so two consecutive ticks (or a tick + a
# manual dispatch) can't race on the same advisory cache. Cancelling
# an in-flight run is safe: every job is idempotent and the next run
# re-scans from scratch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # cargo-deny — advisories + bans + licenses + sources. Same config
  # as `sca.yml`; the EmbarkStudios action always fetches the latest
  # RustSec advisory DB on each run (no in-action cache to bust),
  # so a fresh-DB pass is the default behavior here.
  # ---------------------------------------------------------------------------
  cargo-deny-check:
    name: cargo-deny (fresh DB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Run cargo-deny (gate)
        id: cargo-deny-gate
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823 # v2.0.19
        with:
          command: check
          arguments: --all-features
      - name: Install cargo-deny CLI (for SARIF emit)
        if: always()
        run: |
          set -euo pipefail
          # Keep in sync with sca.yml. 0.18.4 bundles rustsec 0.30.4 /
          # cvss 2.1.0, which aborts with "unsupported CVSS version: 4.0"
          # against the current advisory DB — producing an empty report.
          cargo install cargo-deny --locked --version 0.19.6
      - name: Emit cargo-deny SARIF
        id: cargo-deny-sarif
        if: always()
        run: |
          set -euo pipefail
          # `--format` and `--all-features` are top-level cargo-deny options
          # and MUST precede the `check` subcommand. Placing them after it is
          # a clap usage error, which the trailing `|| true` would quietly
          # turn into an empty-but-valid SARIF — publishing "no findings" to
          # code scanning for a scan that never ran.
          #
          # The non-zero tolerance is still wanted (violations are expected
          # here; enforcement is the separate gate step below), so instead of
          # trusting the exit code we verify the report itself: every line
          # must parse as JSON and cargo-deny must have emitted its terminal
          # `summary` record. That distinguishes a real scan from a crashed
          # one and from an empty file, neither of which may be uploaded.
          cargo deny --format json --all-features check 2> cargo-deny.json || true
          if python3 -c 'import json,sys; sys.exit(0 if any(json.loads(l).get("type") == "summary" for l in sys.stdin if l.strip()) else 1)' < cargo-deny.json 2>/dev/null; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cargo-deny did not produce a complete report; skipping SARIF upload so an empty result cannot be published as a clean scan."
            head -c 2000 cargo-deny.json || true
            exit 0
          fi
          python3 .github/scripts/cargo-deny-to-sarif.py \
            < cargo-deny.json > cargo-deny.sarif
      - name: Upload cargo-deny SARIF
        if: always() && steps.cargo-deny-sarif.outputs.usable == 'true'
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: cargo-deny.sarif
          category: cargo-deny
      - name: Fail if cargo-deny gate failed
        if: steps.cargo-deny-gate.outcome == 'failure'
        run: |
          echo "::error::cargo-deny reported violations; see SARIF upload + step log."
          exit 1

  # ---------------------------------------------------------------------------
  # cargo-audit was REMOVED from this workflow. Do not re-add it without
  # fixing the two upstream problems below first.
  #
  # It had been failing on every run, in both halves, while soft-gated —
  # so it burned ~3 minutes a night to upload a zero-result SARIF under
  # `category: cargo-audit`, which reads as a *clean scan* rather than as a
  # broken one. A scanner that cannot fail loudly is worse than no scanner.
  #
  #   1. `rustsec/audit-check` builds cargo-audit without `--locked`, so it
  #      resolves transitive deps that exceed this repo's 1.88.0 MSRV.
  #   2. The pinned 0.21.2 CLI cannot parse CVSS-4.0 advisories, which the
  #      current RustSec DB contains.
  #
  # Coverage is unaffected: cargo-deny reads the same RustSec database and
  # OSV-Scanner imports RUSTSEC, and both are hard gates in this workflow.
  # `sca.yml`'s header already records dropping cargo-audit as a PR gate for
  # the same reason. `.github/scripts/cargo-audit-to-sarif.py` is kept — it
  # is the re-enable path, and CONTRIBUTING.md documents local `cargo audit`.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # OSV-Scanner — runs the reusable workflow exactly as `sca.yml`
  # does. The action image bundles the OSV.dev dataset at build time;
  # the nightly pinning is to the same SHA on purpose so the analyzer
  # behavior matches the PR-time run. Cadence (nightly) is the value-add.
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: OSV-Scanner (fresh DB)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        -r
        --skip-git
        ./

  # ---------------------------------------------------------------------------
  # OWASP Dependency-Check was REMOVED from this workflow. Read this before
  # re-adding it — the reason is upstream and structural, not a broken key.
  #
  # Dependency-Check matches our dependencies to advisories through **CPE**
  # (Common Platform Enumeration) identifiers attached to each CVE. In April
  # 2026 NIST abandoned universal CVE enrichment at the NVD: only CVEs in
  # CISA's KEV catalog, those affecting federal systems, and EO 14028
  # "critical software" are now enriched. Everything else is listed but left
  # unenriched, and NIST no longer issues its own severity score for CVEs the
  # CNA already scored. CPE assignment is precisely the enrichment that
  # stopped, so this scanner's matching mechanism is degrading at the source.
  #
  # It had also been dead for weeks before anyone noticed — the NVD_API_KEY
  # secret is stale/revoked, so every run aborted with `Invalid API Key`
  # before writing a report. Being soft-gated, it never reddened the run.
  #
  # Java coverage is unaffected: `barback/pom.xml` is scanned by OSV-Scanner
  # and by Trivy, both hard gates in this workflow, and both keyed on package
  # coordinates (PURL) rather than CPE — so neither depends on the enrichment
  # pipeline that degraded. `sca.yml`'s header already records dropping
  # Dependency-Check as a PR gate for redundancy; this finishes that decision.
  #
  # The opt-in `dependency-check` Maven profile in barback/pom.xml is
  # deliberately KEPT as the local/re-enable path (`mvn -f barback/pom.xml
  # -P dependency-check verify`); it is skipped by default.
  #
  # If a third independent opinion on the Java surface is wanted later,
  # prefer Sonatype OSS Index / Sonatype Guide (Dependency-Check supports it
  # natively and it is PURL-based) over re-plumbing NVD.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Trivy `fs` scan — cross-ecosystem catch-all. The aquasecurity
  # action pulls a fresh vulnerability DB on every run (no in-image
  # cache to bust on the nightly schedule), matching `sca.yml`'s
  # behavior. Cadence is the value-add.
  #
  # `secret` scanner remains intentionally OFF — owned by
  # `secret-scan.yml`. Same rationale as `sca.yml`.
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Trivy fs (fresh DB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run Trivy (filesystem scan, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          # Path-scoped FP suppression via skip-dirs/skip-files (mirrors
          # sca.yml; the trivyignores input did not take). Helm chart (fail-
          # guard render), resolver fixtures + frozen p01 bench corpus (static
          # test POMs), and the distroless Dockerfile (DS-0026 by design).
          # Scoped to bench/projects/p01 ONLY — the p03* checkouts pull
          # Spring Boot and must stay scanned. barback/pom.xml stays fully
          # scanned.
          skip-dirs: roastery/deploy/helm,crates/barista-resolver/tests/fixtures,bench/projects/p01
          skip-files: roastery/Dockerfile
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
